<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mycelium Lab</title>
<meta name="description" content="Grow mycelium through type, across a blank page, or between food sources you place.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Serif:wght@300;400;500;600;700&family=Space+Grotesk:wght@300..700&family=Inter:wght@300..900&family=Roboto:wght@300;400;500;700;900&family=Roboto+Condensed:wght@300..900&family=Roboto+Mono:wght@300..700&family=Fraunces:opsz,wght@9..144,300..900&family=Playfair+Display:wght@400..900&family=Archivo+Black&family=DM+Serif+Display&family=Syne:wght@400..800&family=Instrument+Serif&family=Unbounded:wght@300..900&family=Bricolage+Grotesque:opsz,wght@12..96,300..800&display=swap">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700,900&display=swap">
<style>
:root {
  --bg: #e7e3da; --panel: #f6f4ef; --ink: #161616; --soft: #6b675f; --line: #cfc9bc; --accent: #161616;
  --sans: "IBM Plex Sans", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, monospace;
}
body[data-theme="night"] { --bg: #050605; --panel: #121412; --ink: #ebe6d8; --soft: #9a958a; --line: #2e322e; --accent: #ebe6d8; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--sans); display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
header { display: flex; align-items: center; gap: 16px; padding: 12px 18px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
.brand { font-family: "IBM Plex Serif", serif; font-size: 19px; margin: 0; font-weight: 500; white-space: nowrap; }
.brand em { font-style: italic; font-weight: 300; }
#tabs { display: flex; gap: 4px; padding: 3px; border: 1px solid var(--line); border-radius: 999px; }
#tabs button { font: 500 13px var(--sans); color: var(--soft); background: none; border: 0; padding: 7px 16px; border-radius: 999px; cursor: pointer; }
#tabs button.on { background: var(--ink); color: var(--panel); }
#tabs button:focus-visible, .btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.spacer { flex: 1; }
.pill { font: 500 11px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; background: none; color: var(--ink); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; cursor: pointer; }
.app { display: grid; grid-template-columns: 1fr 340px; min-height: 0; }
body.closed .app { grid-template-columns: 1fr 0; }
body.closed aside { display: none; }
#stage { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 0; min-width: 0; padding: 16px; }
#canvas-host { position: relative; line-height: 0; }
#canvas-host canvas { display: block; box-shadow: 0 1px 2px rgba(0,0,0,.1), 0 12px 40px rgba(0,0,0,.12); touch-action: none; cursor: crosshair; }
#trace { position: absolute; pointer-events: none; object-fit: contain; }
#trace[hidden] { display: none; }
#status { font: 11px var(--mono); color: var(--soft); margin-top: 10px; min-height: 16px; text-align: center; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
aside { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding: 18px; }
#about { margin: 0 0 16px; color: var(--soft); }
#controls, .canvas-box { display: grid; gap: 10px; }
h3 { font: 500 10.5px var(--mono); letter-spacing: 0.1em; text-transform: uppercase; margin: 14px 0 0; padding-top: 14px; border-top: 1px dashed var(--line); }
.note { margin: 0; font-size: 12.5px; color: var(--soft); }
.field { display: grid; gap: 5px; }
.field label { font-size: 12.5px; }
.field.toggle { grid-template-columns: auto 1fr; align-items: center; gap: 8px; }
.range { display: grid; grid-template-columns: 1fr 64px; align-items: center; gap: 8px; }
.range output { font: 11px var(--mono); text-align: right; color: var(--soft); }
input[type="range"] { width: 100%; accent-color: var(--ink); }
input[type="checkbox"] { accent-color: var(--ink); width: 16px; height: 16px; }
select, textarea { font: 14px var(--sans); color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 3px; padding: 7px 8px; width: 100%; }
textarea { resize: vertical; min-height: 44px; }
select option { background: var(--panel); color: var(--ink); }
.btn { font: 500 13px var(--sans); color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 3px; padding: 9px 12px; cursor: pointer; text-align: center; }
.btn:hover { border-color: var(--ink); }
.btn.upload { display: block; font-size: 12.5px; margin-top: 4px; border-style: dashed; }
.btn.upload.drop { border-color: var(--ink); background: rgba(127,127,127,.12); }
.visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); border: 0; }
.btn.primary { background: var(--accent); color: var(--panel); border-color: var(--accent); }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
#rec.recording { background: #b3261e; border-color: #b3261e; color: #fff; }
#save-note { font-size: 12px; color: var(--soft); min-height: 1em; margin: 0; }
.keys { font: 11px var(--mono); color: var(--soft); margin: 4px 0 0; }
@media (max-width: 800px) {
  body { overflow: auto; grid-template-rows: auto auto; }
  .app { grid-template-columns: 1fr; grid-template-rows: 70vh auto; }
  body.closed .app { grid-template-columns: 1fr; grid-template-rows: 85vh 0; }
  aside { border-left: 0; border-top: 1px solid var(--line); }
  header { padding: 10px 16px; }
}
</style>
</head>
<body data-theme="paper">
<header>
  <h1 class="brand">Mycelium <em>Lab</em></h1>
  <nav id="tabs" role="tablist" aria-label="Modes">
    <button type="button" role="tab" data-tab="type">Type</button>
    <button type="button" role="tab" data-tab="network">Network</button>
    <button type="button" role="tab" data-tab="paths">Paths</button>
    <button type="button" role="tab" data-tab="text">Text</button>
  </nav>
  <span class="spacer"></span>
  <button type="button" class="pill" id="toggle" aria-controls="panel" aria-expanded="true">Hide controls</button>
</header>
<div class="app">
  <main id="stage">
    <div id="canvas-host"><img id="trace" alt="" aria-hidden="true" hidden></div>
    <div id="status" aria-live="polite"></div>
  </main>
  <aside id="panel" aria-label="Controls">
    <p id="about"></p>
    <div id="controls"></div>
    <h3>Canvas</h3>
    <div class="canvas-box">
      <div class="row">
        <div class="field"><label for="format">Format</label><select id="format"><option value="fit">Fit screen</option><option value="a4">A4 portrait</option><option value="a4l">A4 landscape</option><option value="square">Square</option></select></div>
        <div class="field"><label for="theme">Colour</label><select id="theme"><option value="paper">Ink on paper</option><option value="night">Light on dark</option></select></div>
      </div>
      <div class="field"><label for="speed">Speed</label><div class="range"><input id="speed" type="range" min="0.25" max="4" step="0.25" value="1"><output id="speed-out">1.0×</output></div></div>
      <button type="button" class="btn" id="pause">Pause</button>
      <div class="row"><button type="button" class="btn" id="png">Save PNG</button><button type="button" class="btn" id="svg">Save SVG</button></div>
      <h3>Record a clip</h3>
      <div class="row">
        <div class="field"><label for="clip-len">Length</label><select id="clip-len"><option value="5">5 seconds</option><option value="10">10 seconds</option><option value="15" selected>15 seconds</option><option value="30">30 seconds</option></select></div>
        <div class="field"><label for="clip-from">Start from</label><select id="clip-from"><option value="new">A new growth</option><option value="now">Where it is now</option></select></div>
      </div>
      <div class="field"><label for="clip-q">Quality</label><select id="clip-q"><option value="8">Good (smaller file)</option><option value="16" selected>High</option><option value="30">Best (large file)</option></select></div>
      <button type="button" class="btn primary" id="rec">Record clip</button>
      <p class="note" id="rec-note">Records the canvas as a video (MP4 where your browser supports it, otherwise WebM). The Speed setting makes it a time-lapse.</p>
      <p id="save-note" aria-live="polite"></p>
      <p class="keys">Space pause · N new growth · H hide controls · R record a clip</p>
    </div>
  </aside>
</div>
<script src="lib/p5.min.js"></script>
<script src="js/geometry.js"></script>
<script src="js/svg.js"></script>
<script src="js/hypha.js"></script>
<script src="js/woven.js"></script>
<script src="js/paths.js"></script>
<script src="js/forage.js"></script>
<script src="js/network.js"></script>
<script src="js/text.js"></script>
<script src="js/overtake.js"></script>
<script src="js/app.js"></script>
</body>
</html>
